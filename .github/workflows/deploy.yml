name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One deploy at a time; a new push cancels the in-flight build.
concurrency:
  group: clipstrack-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # .env is gitignored. SITE_URL must exist as a file at build time: next
      # build's prerender workers do not inherit shell env vars, but they do
      # load .env. Defaults to the clipstrack.com origin; override via a repo
      # "variable" named SITE_URL if the domain ever changes.
      - name: Prepare .env for build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          printf 'SITE_URL=%s\n' "${SITE_URL:-https://clipstrack.com}" > .env

      - name: Verify Cloudflare secrets
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          test -n "$CF_API_TOKEN" \
            || { echo "::error::Add CF_API_TOKEN to repo Secrets (Cloudflare token, Workers Scripts edit)"; exit 1; }
          test -n "$CF_ACCOUNT_ID" \
            || { echo "::error::Add CF_ACCOUNT_ID to repo Secrets (found on the Workers overview page, right sidebar)"; exit 1; }

      - name: Build Next.js
        run: npm run build

      - name: Build OpenNext worker
        run: npx opennextjs-cloudflare build

      - name: Stage prerendered cache into assets
        run: |
          mkdir -p .open-next/assets/cdn-cgi
          cp -a .open-next/cache/. .open-next/assets/cdn-cgi/_next_cache/

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        # Worker secrets (DATABASE_URL, ADMIN_SECRET, ...) are set directly on
        # the Worker and are preserved by `wrangler deploy`.
        run: npx wrangler deploy

      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' https://clipstrack.com/)
          test "$code" = "200" \
            && echo "smoke OK ($code)" \
            || { echo "::error::smoke test failed (HTTP $code)"; exit 1; }